services:
  - type: web
    name: phishing-detector-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: /app/ml/models/phishing_model.pkl
      - key: FEATURES_PATH
        value: /app/ml/models/feature_names.json
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DECISION_THRESHOLD
        value: "0.5"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: phishing-detector-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
